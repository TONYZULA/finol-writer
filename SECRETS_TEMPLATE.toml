# Copy this content to Streamlit Cloud Secrets
# Go to: https://share.streamlit.io → Your App → Settings → Secrets

# ============================================================================
# REQUIRED - Minimum configuration to get started
# ============================================================================

# Bytez API - required for AI draft generation
# Get your key at: https://bytez.com/api
BYTEZ_API_KEY = "your-bytez-api-key-here"

# Tavily API - Required for web research
# Get your key at: https://tavily.com
TAVILY_API_KEY = "tvly-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# ============================================================================
# OPTIONAL - Add these for better quality and redundancy
# ============================================================================

# Google Gemini API - Best quality responses
# Get your key at: https://aistudio.google.com/app/apikeys
GOOGLE_API_KEY = "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# OpenRouter API - 30+ free models for variety
# Get your key at: https://openrouter.ai
OPENROUTER_API_KEY = "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# FreeLLM API - Unified access to multiple LLM providers
# Get your key at: https://freellmapi.com (example)
FREELLM_API_KEY = "your-freellmapi-key-here"

# OpenRouter API Base URL (only change if using proxy)
OPENROUTER_API_BASE = "https://openrouter.ai/api/v1"

# OpenRouter Site URL (optional, for rankings)
OR_SITE_URL = "https://yourwebsite.com"

# OpenRouter App Name (optional, for rankings)
OR_APP_NAME = "FINOL Blog Writer"